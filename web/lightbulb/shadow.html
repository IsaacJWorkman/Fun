<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lights Out</title>

  <!-- ===== Font: VT323 pixel font for the 8-bit look ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- ===== Interactive lamp (optional: page still works without it) ===== -->
  <script src="lamp.js" defer></script>
</head>
<body>

  <!-- ===== Lighting layers (fixed, never move) ===== -->
  <div class="pool" aria-hidden="true"></div>   <!-- stepped light bands around the bulb -->
  <div class="cord" aria-hidden="true"></div>   <!-- wire from the ceiling to the bulb -->

  <!-- ===== Pixel-art bulb (24x34 grid, each unit = 1 "pixel") ===== -->
  <svg class="bulb" viewBox="0 0 24 34" shape-rendering="crispEdges" aria-hidden="true">
    <!-- socket: cap, ribs, neck -->
    <rect x="9" y="0" width="6"  height="2" fill="#3a3a3a"/>
    <rect x="7" y="2" width="10" height="2" fill="#8a8a8a"/>
    <rect x="7" y="4" width="10" height="1" fill="#4a4a4a"/>
    <rect x="7" y="5" width="10" height="2" fill="#8a8a8a"/>
    <rect x="7" y="7" width="10" height="1" fill="#4a4a4a"/>
    <rect x="8" y="2" width="2"  height="2" fill="#b8b8b8"/>
    <rect x="8" y="5" width="2"  height="2" fill="#b8b8b8"/>
    <rect x="8" y="8" width="8"  height="2" fill="#6a6a6a"/>

    <!-- glass outline (full silhouette, inner fill drawn on top) -->
    <g fill="#7a5414">
      <rect x="8" y="10" width="8"  height="1"/>
      <rect x="7" y="11" width="10" height="1"/>
      <rect x="5" y="12" width="14" height="1"/>
      <rect x="3" y="13" width="18" height="1"/>
      <rect x="2" y="14" width="20" height="1"/>
      <rect x="1" y="15" width="22" height="1"/>
      <rect x="0" y="16" width="24" height="12"/>
      <rect x="1" y="28" width="22" height="1"/>
      <rect x="2" y="29" width="20" height="1"/>
      <rect x="3" y="30" width="18" height="1"/>
      <rect x="5" y="31" width="14" height="1"/>
      <rect x="7" y="32" width="10" height="1"/>
      <rect x="9" y="33" width="6"  height="1"/>
    </g>

    <!-- glass base color -->
    <g fill="#ffd75e">
      <rect x="8" y="11" width="8"  height="1"/>
      <rect x="7" y="12" width="10" height="1"/>
      <rect x="5" y="13" width="14" height="1"/>
      <rect x="3" y="14" width="18" height="1"/>
      <rect x="2" y="15" width="20" height="1"/>
      <rect x="1" y="16" width="22" height="12"/>
      <rect x="2" y="28" width="20" height="1"/>
      <rect x="3" y="29" width="18" height="1"/>
      <rect x="4" y="30" width="16" height="1"/>
      <rect x="6" y="31" width="12" height="1"/>
      <rect x="8" y="32" width="8"  height="1"/>
    </g>

    <!-- shading: darker lower-right crescent -->
    <g fill="#f0ae38">
      <rect x="19" y="20" width="3"  height="8"/>
      <rect x="17" y="26" width="5"  height="2"/>
      <rect x="15" y="28" width="7"  height="1"/>
      <rect x="12" y="29" width="9"  height="1"/>
      <rect x="9"  y="30" width="11" height="1"/>
      <rect x="7"  y="31" width="11" height="1"/>
      <rect x="8"  y="32" width="8"  height="1"/>
    </g>

    <!-- highlight: lighter upper-left area + white glint -->
    <g fill="#fff0a8">
      <rect x="3" y="15" width="7" height="2"/>
      <rect x="2" y="17" width="6" height="5"/>
      <rect x="5" y="13" width="5" height="2"/>
    </g>
    <rect x="4" y="16" width="2" height="5" fill="#ffffff"/>
    <rect x="6" y="14" width="2" height="2" fill="#ffffff"/>

    <!-- filament: support wires + glowing coil -->
    <rect x="10" y="11" width="1" height="9" fill="#b88a3a"/>
    <rect x="13" y="11" width="1" height="9" fill="#b88a3a"/>
    <rect x="9"  y="20" width="6" height="1" fill="#ff8a1a"/>
    <rect x="10" y="19" width="1" height="1" fill="#ff8a1a"/>
    <rect x="12" y="19" width="1" height="1" fill="#ff8a1a"/>
    <rect x="11" y="20" width="2" height="1" fill="#fff3c0"/>
  </svg>

  <!-- ===== Text: every .line gets lit as it scrolls past the bulb ===== -->
  <main>
    <p class="line hint">scroll &#9660;</p>

    <h1 class="line">LIGHTS OUT</h1>

    <p class="stanza">
      <span class="line">the dark was here first</span>
      <span class="line">it does not mind the wait</span>
    </p>

    <p class="stanza">
      <span class="line">one bulb, one cord</span>
      <span class="line">one small argument with night</span>
    </p>

    <p class="stanza">
      <span class="line">every word you pass</span>
      <span class="line">leans away from the glow</span>
    </p>

    <p class="stanza">
      <span class="line">shadows are just letters</span>
      <span class="line">learning how to stand</span>
    </p>

    <p class="stanza">
      <span class="line">keep scrolling</span>
      <span class="line">the dark will keep you</span>
    </p>
  </main>

  <!-- ===== CRT scanline overlay ===== -->
  <div class="scanlines" aria-hidden="true"></div>

</body>
</html>
